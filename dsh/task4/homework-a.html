<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Task4 作业A：前 3 章概念地图</title>
<style>
  body{margin:0;background:#fff;display:flex;justify-content:center;font-family:"Microsoft YaHei","PingFang SC",sans-serif}
  svg{max-width:1440px;width:100%;height:auto}
</style>
</head>
<body>
<svg viewBox="0 0 1400 1000" xmlns="http://www.w3.org/2000/svg">
<defs>
  <marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="3.5" orient="auto">
    <path d="M0,0 L8,3.5 L0,7 Z" fill="#5F5E5A"/>
  </marker>
  <marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="3.5" orient="auto">
    <path d="M0,0 L8,3.5 L0,7 Z" fill="#BA7517"/>
  </marker>
</defs>

<text x="700" y="40" text-anchor="middle" font-size="23" font-weight="bold" fill="#2b2b2b">前 3 章概念地图：以 Harness 为中心</text>
<text x="700" y="66" text-anchor="middle" font-size="13.5" fill="#6b6b6b">17 个核心术语 · 实线 = 提供 / 组成，虚线 = 同一能力的两种呈现</text>
<text x="700" y="92" text-anchor="middle" font-size="12.5" fill="#9a8f78">读图顺序：① 最上 Kernel（规则）→ ② 中间 Harness（= Kernel + Host + Agent）→ ③ 左右两层 → ④ 下方 Session 与 Trace</text>

<!-- ===== Cordis Kernel ===== -->
<rect x="450" y="112" width="500" height="96" rx="12" fill="#F0EDF7" stroke="#6B5B95" stroke-width="1.2"/>
<text x="470" y="140" font-size="15.5" font-weight="bold" fill="#4A3D73">Cordis Kernel（内核）</text>
<text x="470" y="166" font-size="12.5" fill="#5B4E86">挂载 / 卸载 · 能力发现与依赖 · 事件传递 · 资源清理</text>
<text x="470" y="190" font-size="12" fill="#8A7FA8">只管规则，不管功能——不属于任何 Preset</text>

<!-- ===== Harness 中心 ===== -->
<rect x="530" y="268" width="340" height="104" rx="14" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.5"/>
<text x="550" y="298" font-size="19" font-weight="bold" fill="#2C2C2A">Harness</text>
<text x="550" y="322" font-size="12.5" fill="#5F5E5A">= Kernel（规则）</text>
<text x="550" y="342" font-size="12.5" fill="#5F5E5A">+ Host Plane（共享）</text>
<text x="550" y="362" font-size="12.5" fill="#5F5E5A">+ Agent Plane（组合）</text>

<!-- ===== Host Plane ===== -->
<rect x="50" y="238" width="390" height="342" rx="14" fill="#EFF6FE" stroke="#A8C8EA" stroke-width="1.2"/>
<text x="72" y="268" font-size="16" font-weight="bold" fill="#0C447C">Host Plane（宿主层）</text>
<text x="72" y="290" font-size="12.5" fill="#4a6f96">共享 · 常驻 · 全进程一份</text>

<rect x="70" y="306" width="350" height="42" rx="8" fill="#fff" stroke="#BBD7F2" stroke-width="0.8"/>
<text x="88" y="332" font-size="13.5" fill="#2b2b2b">Tool Registry（工具注册表）</text>

<rect x="70" y="356" width="350" height="42" rx="8" fill="#fff" stroke="#BBD7F2" stroke-width="0.8"/>
<text x="88" y="382" font-size="13.5" fill="#2b2b2b">Model Route（模型路由）</text>

<rect x="70" y="406" width="350" height="42" rx="8" fill="#fff" stroke="#BBD7F2" stroke-width="0.8"/>
<text x="88" y="432" font-size="13.5" fill="#2b2b2b">Persistence（持久化）</text>

<rect x="70" y="456" width="350" height="42" rx="8" fill="#fff" stroke="#BBD7F2" stroke-width="0.8"/>
<text x="88" y="482" font-size="13.5" fill="#2b2b2b">Sandbox / Approval（沙箱与审批）</text>

<text x="72" y="534" font-size="12" fill="#6a8fb5">提供能力，不决定怎么用</text>

<!-- ===== Agent Plane ===== -->
<rect x="960" y="238" width="390" height="342" rx="14" fill="#FDF6EC" stroke="#E0C9A0" stroke-width="1.2"/>
<text x="982" y="268" font-size="16" font-weight="bold" fill="#8a5a00">Agent Plane（会话层）</text>
<text x="982" y="290" font-size="12.5" fill="#9a7a45">各会话自己的组合 · 互不干扰</text>

<rect x="980" y="306" width="350" height="42" rx="8" fill="#fff" stroke="#E6D3AE" stroke-width="0.8"/>
<text x="998" y="332" font-size="13.5" fill="#2b2b2b">Tool Presentation（工具呈现）</text>

<rect x="980" y="352" width="350" height="42" rx="8" fill="#fff" stroke="#E6D3AE" stroke-width="0.8"/>
<text x="998" y="378" font-size="13.5" fill="#2b2b2b">Scope（作用域）</text>

<rect x="980" y="398" width="350" height="42" rx="8" fill="#fff" stroke="#E6D3AE" stroke-width="0.8"/>
<text x="998" y="424" font-size="13.5" fill="#2b2b2b">Composition（能力组合）</text>

<text x="982" y="468" font-size="12" fill="#a08a60">Preset（配置单）决定挂哪些：</text>
<rect x="980" y="478" width="170" height="42" rx="6" fill="#FDEEE8" stroke="#E8956F" stroke-width="0.7"/>
<text x="1065" y="494" font-size="12" font-weight="bold" fill="#a8401f" text-anchor="middle">Standard</text>
<text x="1065" y="510" font-size="10.5" fill="#b0603c" text-anchor="middle">完整基线</text>
<rect x="1160" y="478" width="170" height="42" rx="6" fill="#FDEEE8" stroke="#E8956F" stroke-width="0.7"/>
<text x="1245" y="494" font-size="12" font-weight="bold" fill="#a8401f" text-anchor="middle">PTC</text>
<text x="1245" y="510" font-size="10.5" fill="#b0603c" text-anchor="middle">换呈现方式</text>
<rect x="980" y="526" width="170" height="42" rx="6" fill="#FDEEE8" stroke="#E8956F" stroke-width="0.7"/>
<text x="1065" y="542" font-size="12" font-weight="bold" fill="#a8401f" text-anchor="middle">Minimal</text>
<text x="1065" y="558" font-size="10.5" fill="#b0603c" text-anchor="middle">压到最薄</text>
<rect x="1160" y="526" width="170" height="42" rx="6" fill="#FDEEE8" stroke="#E8956F" stroke-width="0.7"/>
<text x="1245" y="542" font-size="12" font-weight="bold" fill="#a8401f" text-anchor="middle">Creative</text>
<text x="1245" y="558" font-size="10.5" fill="#b0603c" text-anchor="middle">加自修改</text>

<!-- ===== Session / Trace ===== -->
<rect x="560" y="420" width="280" height="64" rx="10" fill="#EAF3DE" stroke="#97C459" stroke-width="1"/>
<text x="700" y="446" font-size="14.5" font-weight="bold" fill="#27500A" text-anchor="middle">Session（一次会话实例）</text>
<text x="700" y="468" font-size="11.5" fill="#3B6D11" text-anchor="middle">挂一份 Preset，跑在自己的 Scope 里</text>

<rect x="560" y="520" width="280" height="58" rx="10" fill="#EAF3DE" stroke="#97C459" stroke-width="1"/>
<text x="700" y="546" font-size="14.5" font-weight="bold" fill="#27500A" text-anchor="middle">Trace（客观调用记录）</text>
<text x="700" y="566" font-size="11.5" fill="#3B6D11" text-anchor="middle">取证只看它，不信模型自述</text>

<!-- ===== 连线 ===== -->
<g stroke="#5F5E5A" stroke-width="1.4" fill="none" marker-end="url(#a1)">
  <line x1="700" y1="208" x2="700" y2="264"/>
  <line x1="440" y1="310" x2="526" y2="310"/>
  <line x1="874" y1="300" x2="956" y2="300"/>
  <line x1="700" y1="420" x2="700" y2="376"/>
  <line x1="700" y1="484" x2="700" y2="516"/>
</g>
<text x="712" y="238" font-size="11.5" fill="#5F5E5A">基础语义</text>
<text x="483" y="300" font-size="11.5" fill="#185FA5" text-anchor="middle">提供共享能力</text>
<text x="915" y="290" font-size="11.5" fill="#8a5a00" text-anchor="middle">决定会话组合</text>
<text x="712" y="400" font-size="11.5" fill="#3B6D11">运行实例</text>

<!-- Preset → Composition -->
<g stroke="#BA7517" stroke-width="1.4" fill="none" marker-end="url(#a2)">
  <line x1="1085" y1="478" x2="1085" y2="444"/>
</g>
<text x="1097" y="464" font-size="11.5" fill="#a8401f">挂载</text>

<!-- Tool Registry ↔ Tool Presentation 虚线 -->
<g stroke="#BA7517" stroke-width="1.3" fill="none" stroke-dasharray="6,4" marker-end="url(#a2)">
  <path d="M440,340 L440,230 L940,230 L940,327 L956,327"/>
</g>
<text x="690" y="220" font-size="12" fill="#a8401f" text-anchor="middle">同一套工具 → 换一种呈现方式</text>

<!-- ===== 底部关系说明 ===== -->
<rect x="50" y="610" width="1300" height="150" rx="12" fill="#FBF7EE" stroke="#E6D3AE" stroke-width="0.8"/>
<text x="72" y="638" font-size="13.5" font-weight="bold" fill="#2b2b2b">六条关系，记住这张图</text>
<text x="72" y="664" font-size="12.5" fill="#444441">① Harness = Cordis Kernel（规则） + Host Plane（共享） + Agent Plane（组合）——三者缺一不可</text>
<text x="72" y="688" font-size="12.5" fill="#444441">② Host Plane 提供 Tool Registry / Model Route / Persistence / Sandbox，但它不决定某个会话怎么用</text>
<text x="72" y="712" font-size="12.5" fill="#444441">③ Agent Plane 通过 Preset 决定 Composition、Scope、Tool Presentation——每个会话各自一份</text>
<text x="72" y="736" font-size="12.5" fill="#444441">④ Tool Registry 与 Tool Presentation 是"同一套工具、两种呈现"（Task2 的 UNKNOWN_TOOL 就出在这里）</text>
<text x="720" y="664" font-size="12.5" fill="#444441">⑤ Session 是 Harness 的一次运行实例，挂一份 Preset，产出一条 Trace</text>
<text x="720" y="688" font-size="12.5" fill="#444441">⑥ Kernel 只保留"换零件不散架"的规则：挂载/卸载、能力发现、事件传递、资源清理</text>
<text x="720" y="712" font-size="12.5" fill="#444441">⑦ "一切皆插件"≠ 没有内核——没有 ⑥ 的规则，③ 的组合根本跑不起来</text>
<text x="720" y="736" font-size="12" fill="#8a8578">虚线 = 跨层关系；其余实线 = 提供 / 组成 / 运行</text>

<!-- ===== 章节归属（回溯） ===== -->
<text x="72" y="792" font-size="12.5" fill="#6b6b6b">术语来源：Harness / Host Plane / Agent Plane / Scope / Preset —— 导读 + 第 1 章（Task1）；Tool Presentation / 4 套 Preset / Trace —— 第 2 章（Task2）；Composition / Kernel —— 第 3 章（Task3/4）</text>
</svg>
