<text x="500" y="786" text-anchor="middle" font-size="12" fill="#8a8578">依据本书图 3-2 / 图 3-4 绘制 · Standard 10 项组合项（3.3 节）展开为 12 个标注条目，其中 5 项需跨层映射</text>
