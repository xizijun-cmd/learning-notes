<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Task3 作业①：Host Plane / Agent Plane 分层图</title>
<style>
  body{margin:0;background:#fff;display:flex;justify-content:center;font-family:"Microsoft YaHei","PingFang SC",sans-serif}
  svg{max-width:1240px;width:100%;height:auto}
</style>
</head>
<body>
<svg viewBox="0 0 1160 900" xmlns="http://www.w3.org/2000/svg">
<defs>
  <marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="3.5" orient="auto">
    <path d="M0,0 L8,3.5 L0,7 Z" fill="#c0562a"/>
  </marker>
</defs>

<text x="580" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#2b2b2b">Standard 的 12 项能力：谁在配，谁在干</text>
<text x="580" y="66" text-anchor="middle" font-size="13.5" fill="#6b6b6b">左边 = 这个会话自己配的；右边 = 全进程共用的；橙色 5 项 = 必须跨层执行的工具</text>
<text x="580" y="92" text-anchor="middle" font-size="12.5" fill="#9a8f78">读图顺序：① 左边看这个会话配了什么 → ② 找橙色 5 个工具 → ③ 顺着箭头看右边谁真正执行</text>

<rect x="40" y="110" width="440" height="710" rx="18" fill="#FDF6EC" stroke="#E0C9A0" stroke-width="1.2"/>
<rect x="680" y="110" width="440" height="710" rx="18" fill="#EFF6FE" stroke="#A8C8EA" stroke-width="1.2"/>

<text x="64" y="142" font-size="17" font-weight="bold" fill="#8a5a00">Agent Plane（会话层）</text>
<text x="64" y="164" font-size="12.5" fill="#9a7a45">这间房自己的装修：给模型看什么、怎么用</text>

<text x="704" y="142" font-size="17" font-weight="bold" fill="#0C447C">Host Plane（宿主层）</text>
<text x="704" y="164" font-size="12.5" fill="#4a6f96">整栋楼的水电：谁真正提供和执行</text>

<!-- 右：顶部说明区（替代原共享设施列表，避免与下方组标题重叠） -->
<rect x="700" y="184" width="400" height="146" rx="10" fill="#fff" stroke="#D6E6F5" stroke-width="0.6"/>
<text x="718" y="210" font-size="13" font-weight="bold" fill="#185FA5">右边分两块，别看混：</text>
<text x="718" y="236" font-size="12.5" fill="#4a6f96">· 中间 5 项 = 执行方：替模型真正干活</text>
<text x="718" y="260" font-size="12.5" fill="#4a6f96">· 下面 4 项 = 共享设施：注册表、路由、</text>
<text x="736" y="282" font-size="12.5" fill="#4a6f96">存储、沙箱，全进程共用</text>
<text x="718" y="310" font-size="12.5" fill="#9a7a45">左侧只有 5 个工具要来找执行方，</text>
<text x="718" y="330" font-size="12.5" fill="#9a7a45">其余能力都活在会话里，不需要执行方。</text>

<!-- ===== 左：① 角色与提示词 ===== -->
<rect x="56" y="182" width="4" height="14" fill="#BA7517"/>
<text x="68" y="194" font-size="12.5" font-weight="bold" fill="#8a5a00">① 角色与提示词　跟随 Agent / Preset</text>

<rect x="56" y="204" width="408" height="36" rx="8" fill="#fff" stroke="#E6D3AE" stroke-width="0.6"/>
<text x="74" y="227" font-size="13.5" fill="#2b2b2b">Persona / Instructions（人设与指令）</text>

<rect x="56" y="248" width="408" height="36" rx="8" fill="#fff" stroke="#E6D3AE" stroke-width="0.6"/>
<text x="74" y="271" font-size="13.5" fill="#2b2b2b">Prompt Sections（提示词段落）</text>

<rect x="56" y="292" width="408" height="36" rx="8" fill="#fff" stroke="#E6D3AE" stroke-width="0.6"/>
<text x="74" y="315" font-size="13.5" fill="#2b2b2b">Skill Catalog（技能目录）</text>

<!-- ===== 左：② 工具（跨层） ===== -->
<rect x="56" y="352" width="4" height="14" fill="#D85A30"/>
<text x="68" y="364" font-size="12.5" font-weight="bold" fill="#a8401f">② 面向模型的工具　这 5 个必须落到 Host 执行</text>

<rect x="56" y="374" width="408" height="36" rx="8" fill="#FDEEE8" stroke="#E8956F" stroke-width="0.9"/>
<text x="74" y="397" font-size="13.5" fill="#2b2b2b">tool-fs（文件读写工具）</text>

<rect x="56" y="418" width="408" height="36" rx="8" fill="#FDEEE8" stroke="#E8956F" stroke-width="0.9"/>
<text x="74" y="441" font-size="13.5" fill="#2b2b2b">tool-bash（Shell 命令执行）</text>

<rect x="56" y="462" width="408" height="36" rx="8" fill="#FDEEE8" stroke="#E8956F" stroke-width="0.9"/>
<text x="74" y="485" font-size="13.5" fill="#2b2b2b">tool-web（联网搜索 / 抓取）</text>

<rect x="56" y="506" width="408" height="36" rx="8" fill="#FDEEE8" stroke="#E8956F" stroke-width="0.9"/>
<text x="74" y="529" font-size="13.5" fill="#2b2b2b">tool-goal（规划 / 目标管理）</text>

<rect x="56" y="550" width="408" height="36" rx="8" fill="#FDEEE8" stroke="#E8956F" stroke-width="0.9"/>
<text x="74" y="573" font-size="13.5" fill="#2b2b2b">tool-subagent（派生子 Agent）</text>

<!-- ===== 左：③ 会话级状态 ===== -->
<rect x="56" y="612" width="4" height="14" fill="#BA7517"/>
<text x="68" y="624" font-size="12.5" font-weight="bold" fill="#8a5a00">③ 会话级状态　跟随 Session</text>

<rect x="56" y="634" width="408" height="36" rx="8" fill="#fff" stroke="#E6D3AE" stroke-width="0.6"/>
<text x="74" y="657" font-size="13.5" fill="#2b2b2b">Plan / Goal 状态（计划与目标状态）</text>

<rect x="56" y="678" width="408" height="36" rx="8" fill="#fff" stroke="#E6D3AE" stroke-width="0.6"/>
<text x="74" y="701" font-size="13.5" fill="#2b2b2b">Workflow 状态（工作流状态）</text>

<rect x="56" y="722" width="408" height="36" rx="8" fill="#fff" stroke="#E6D3AE" stroke-width="0.6"/>
<text x="74" y="745" font-size="13.5" fill="#2b2b2b">Context / Compaction（上下文与压缩）</text>

<!-- ===== 左：④ 交互 ===== -->
<rect x="56" y="776" width="4" height="14" fill="#BA7517"/>
<text x="68" y="788" font-size="12.5" font-weight="bold" fill="#8a5a00">④ 交互　跟随 Preset</text>
<rect x="56" y="794" width="408" height="24" rx="8" fill="#fff" stroke="#E6D3AE" stroke-width="0.6"/>
<text x="74" y="811" font-size="13" fill="#2b2b2b">Interaction（用户交互）</text>

<!-- ===== 右：执行方（与左侧 5 个工具水平对齐） ===== -->
<rect x="696" y="352" width="4" height="14" fill="#378ADD"/>
<text x="708" y="364" font-size="12.5" font-weight="bold" fill="#185FA5">执行方　替模型真正干活（与左侧橙色一一对应）</text>

<rect x="696" y="374" width="408" height="36" rx="8" fill="#E3F0FC" stroke="#7FB0E0" stroke-width="0.9"/>
<text x="714" y="397" font-size="13" fill="#2b2b2b">filesystem service + policy（文件系统服务与策略）</text>

<rect x="696" y="418" width="408" height="36" rx="8" fill="#E3F0FC" stroke="#7FB0E0" stroke-width="0.9"/>
<text x="714" y="441" font-size="13" fill="#2b2b2b">shell / subprocess executor（Shell 与子进程执行器）</text>

<rect x="696" y="462" width="408" height="36" rx="8" fill="#E3F0FC" stroke="#7FB0E0" stroke-width="0.9"/>
<text x="714" y="485" font-size="13" fill="#2b2b2b">web service / provider（联网服务与提供方）</text>

<rect x="696" y="506" width="408" height="36" rx="8" fill="#E3F0FC" stroke="#7FB0E0" stroke-width="0.9"/>
<text x="714" y="529" font-size="13" fill="#2b2b2b">goal service（目标服务）</text>

<rect x="696" y="550" width="408" height="36" rx="8" fill="#E3F0FC" stroke="#7FB0E0" stroke-width="0.9"/>
<text x="714" y="573" font-size="12.5" fill="#2b2b2b">subagent registry / providers（子 Agent 注册与提供）</text>

<!-- 箭头 5 条水平直线 -->
<g stroke="#D85A30" stroke-width="1.6" fill="none" marker-end="url(#ar)">
  <line x1="468" y1="392" x2="688" y2="392"/>
  <line x1="468" y1="436" x2="688" y2="436"/>
  <line x1="468" y1="480" x2="688" y2="480"/>
  <line x1="468" y1="524" x2="688" y2="524"/>
  <line x1="468" y1="568" x2="688" y2="568"/>
</g>

<!-- ===== 右：共享设施（移到底部，避免与组标题重叠） ===== -->
<rect x="696" y="612" width="4" height="14" fill="#378ADD"/>
<text x="708" y="624" font-size="12.5" font-weight="bold" fill="#185FA5">共享设施　共享 · 常驻（shared infrastructure）</text>

<rect x="696" y="634" width="408" height="36" rx="8" fill="#fff" stroke="#BBD7F2" stroke-width="0.6"/>
<text x="714" y="657" font-size="13.5" fill="#2b2b2b">Tool Registry（工具注册表）</text>

<rect x="696" y="678" width="408" height="36" rx="8" fill="#fff" stroke="#BBD7F2" stroke-width="0.6"/>
<text x="714" y="701" font-size="13.5" fill="#2b2b2b">Model Route（模型路由）</text>

<rect x="696" y="722" width="408" height="36" rx="8" fill="#fff" stroke="#BBD7F2" stroke-width="0.6"/>
<text x="714" y="745" font-size="13.5" fill="#2b2b2b">Persistence（持久化存储）</text>

<rect x="696" y="766" width="408" height="36" rx="8" fill="#fff" stroke="#BBD7F2" stroke-width="0.6"/>
<text x="714" y="789" font-size="13.5" fill="#2b2b2b">Sandbox / Approval（沙箱与审批）</text>

<rect x="40" y="840" width="1080" height="44" rx="10" fill="#FBF7EE" stroke="#E6D3AE" stroke-width="0.8"/>
<text x="580" y="867" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b">左边决定"模型手里有什么、怎么用"，右边决定"这些东西由谁真正执行"</text>
</svg>
